<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="response.html" target="_blank" name="biodata" method="get">
        <fieldset>
            <legend>BIODATA</legend>
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name" placeholder="Enter your name" required><hr>
            <label for="DOB">DOB:</label>
            <input type="date" id="DOB" name="DOB" required><hr
            <label for="Email">Email:</label>
            <input type="Email" id="Email" name="Email" placeholder="Enter your email" required><hr>
            <label for="Phone">Phone:</label>
            <input type="tel" id="Phone" name="Phone" placeholder="Enter your phone number" minlength="0" maxlength="10" required/><hr>
            <label for="attempt">Attempt:</label>
            <input type="number" id="attempt" name="attempt" min="1" max="3" required><hr>
            <label for="link">Link:</label>
            <input type="url" id="link" name="link" placeholder="Enter your website link" required><hr>

            <label for="Gender">Gender:</label>
            <br>
            <input type="radio" id="Male" name="Gender" value="Male" required>
            <label for="Male">Male</label>
            <br>
            <input type="radio" id="Female" name="Gender" value="Female" required>
             <label for="Female">Female</label><br>
            

             <hr>
                <label for="check">vehicles you have :</label><BR>
                <input type="checkbox" id="bike" name="vehicle 1" value="Bike">
                <label for="bike"> BIKE</label><BR>
                <input type="checkbox" id="car" name="vehicle 2" value="Car">
                <label for="car"> CAR</label><BR>
                <input type="checkbox" id="cycle" name="vehicle 3" value="Cycle">
                <label for="cycle">CYCLE</label>
                



    

        </fieldset>
        <fieldset>
            <LABEL FOR="LANG">SELECT YOUR PROGRAMMING LANGUAGE:</LABEL>
            <SELECT NAME="LANG" ID="LANG" REQUIRED>
                <optgroup label="backend">
                <OPTION VALUE="C">C</OPTION>
                <OPTION VALUE="C++">C++</OPTION>
                <OPTION VALUE="JAVA">JAVA</OPTION>
                <OPTION VALUE="PYTHON">PYTHON</OPTION>
                <OPTION VALUE="JAVASCRIPT">JAVASCRIPT</OPTION>
                <OPTION VALUE="HTML">HTML</OPTION></optgroup>
                <optgroup label="PROGRAMMING">
                <OPTION VALUE="CSS">CSS</OPTION>
                <OPTION VALUE="RUBY">RUBY</OPTION>
                <OPTION VALUE="PHP">PHP</OPTION>
                <OPTION VALUE="SWIFT">SWIFT</OPTION>
                <OPTION VALUE="KOTLIN">KOTLIN</OPTION>
                <OPTION VALUE="SQL">SQL</OPTION>
                <OPTION VALUE="RUST">RUST</OPTION>
                <OPTION VALUE="GO">GO</OPTION></optgroup>
                </SELECT>

                <hr>
                <label for ="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required><hr>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required><hr>
                <label for="appointment">Appointment:</label>
                <input type="time" id="appointment" name="appointment" required><hr>
                <label for="file"File uplaod:</label>
                <input type="file" id="file" name="file" required><hr>
                <label for="address">Address:  </label>
                    <textarea id="address" name="address" rows="4" cols="20" placeholder="enter your address" required></textarea>
              

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">  
        </fieldset>



    </form>
    
</body>
</html>
